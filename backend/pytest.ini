[pytest]
asyncio_mode = auto
# Все тесты и фикстуры выполняются в одном сессионном event loop:
# пулы подключений SQLAlchemy/asyncpg создаются один раз при импорте приложения.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
